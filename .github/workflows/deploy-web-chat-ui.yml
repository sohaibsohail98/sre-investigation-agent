name: Deploy web-chat-ui

# Separate from deploy-agentcore.yml (which deploys the Bedrock
# AgentCore runtime to AWS on the same paths) — this deploys the chat
# UI's Cloud Run service + its Cloudflare Worker reverse proxy.
# Independent infra, independent failure modes, kept as its own job.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "agent/**"
      - "tools/**"
      - "data/**"
      - "common/**"
      - "requirements-dev.txt"
      - "cloudflare-proxy/**"
      - ".github/workflows/deploy-web-chat-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  SERVICE: web-chat-ui
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/sre-platform/web-chat-ui

jobs:
  deploy-cloud-run:
    runs-on: ubuntu-latest
    outputs:
      service_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -r requirements-dev.txt
      - run: uv run python -m pytest

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker buildx build --platform linux/amd64 -f web/Dockerfile \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:latest" \
            --push .

      - id: deploy
        name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image="${IMAGE}:${{ github.sha }}" \
            --project="${{ vars.GCP_PROJECT }}" \
            --region="$REGION" \
            --quiet
          echo "url=$(gcloud run services describe $SERVICE --project=${{ vars.GCP_PROJECT }} --region=$REGION --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the deployment
        run: |
          curl -sf "${{ steps.deploy.outputs.service_url }}/health" | grep -q '"status":"ok"'

  deploy-cloudflare-worker:
    needs: deploy-cloud-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-proxy
    steps:
      - uses: actions/checkout@v4
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test the Worker proxy
        run: |
          sleep 5
          curl -sf "https://sre-agent.sohaibsohail.workers.dev/health" | grep -q '"status":"ok"'
